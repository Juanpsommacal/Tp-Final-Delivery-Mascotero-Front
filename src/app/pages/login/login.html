<section class="login-contenedor">
  <div class="login-card">
    <div class="login-header">
      <img src="/DeliveryMascoteroLogo.jpg" alt="Logo" class="login-logo" />
      <h2>Iniciar sesión</h2>
      <p>Ingresá tus credenciales para acceder a tu cuenta</p>
    </div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="campo">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" placeholder="usuario@email.com"
               [ngModel]="email()" (ngModelChange)="email.set($event)" required />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" placeholder="••••••••"
               [ngModel]="password()" (ngModelChange)="password.set($event)" required />
      </div>

      <button type="submit" class="boton boton-accent boton-submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    @if (mensaje()) {
      <p class="error-banner">{{ mensaje() }}</p>
    }

    <p class="login-footer">
      ¿No tenés cuenta? <a routerLink="/registro">Crear cuenta</a>
    </p>
  </div>
</section>
