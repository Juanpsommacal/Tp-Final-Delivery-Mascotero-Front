    <div class="login-card">
      <div class="login-header">
        <h1>Iniciar sesión</h1>
        <p>Ingresá con tu email y tu contraseña</p>
      </div>

      <form (ngSubmit)="iniciarSesion()">
        <div class="campo">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" placeholder="usuario@email.com" autocomplete="email"
                 [ngModel]="email()" (ngModelChange)="email.set($event)" required
                 [attr.aria-invalid]="!!mensaje()" [attr.aria-describedby]="mensaje() ? 'login-error' : null" />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" autocomplete="current-password"
                 [ngModel]="password()" (ngModelChange)="password.set($event)" required
                 [attr.aria-invalid]="!!mensaje()" [attr.aria-describedby]="mensaje() ? 'login-error' : null" />
        </div>

        <button type="submit" class="boton boton-accent boton-submit" [disabled]="cargando()">
          {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>

      <p class="error-banner" id="login-error" role="alert" [hidden]="!mensaje()">{{ mensaje() }}</p>

      <p class="pie-login">¿Todavía no tenés cuenta? <a routerLink="/registro">Registrate</a></p>
    </div>
  </div>
</section>
