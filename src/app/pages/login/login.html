<section class="login-contenedor">

  <div class="login-card-wrapper" [attr.data-estado]="estadoGatito()">

    <!-- El gatito del logo pasea en patineta por el borde de arriba de la tarjeta -->
    <div class="pista-gatito" aria-hidden="true">
      <div class="gatito-recorrido">
        <div class="gatito-sentido">
          <svg class="gatito-skate" viewBox="0 0 120 132" width="104" height="114">
            <!-- Cola -->
            <path class="cola" d="M34 96 C16 96 10 74 18 62 C22 56 28 58 26 64 C21 74 24 88 36 90"
                  fill="#fdf6ea" stroke="#1d2326" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />

            <!-- Cuerpo y orejas -->
            <path d="M31 106 C27 82 30 56 38 42 L36 14 L52 29 C58 27 66 27 72 29 L88 14 L87 42 C96 56 98 82 94 106 Z"
                  fill="#fdf6ea" stroke="#1d2326" stroke-width="2.6" stroke-linejoin="round" />

            <!-- Patita apoyada en el costado -->
            <path d="M92 72 C102 76 106 84 104 90 C102 94 97 93 96 89"
                  fill="#fdf6ea" stroke="#1d2326" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Patas de adelante -->
            <path d="M51 80 C49 92 50 100 52 105" fill="none" stroke="#1d2326" stroke-width="2.4" stroke-linecap="round" />
            <path d="M63 82 C63 92 62 100 60 105" fill="none" stroke="#1d2326" stroke-width="2.4" stroke-linecap="round" />
            <path d="M55 106 C58 101 64 101 67 106" fill="#fdf6ea" stroke="#1d2326" stroke-width="2.4" stroke-linecap="round" />

            <!-- Ojos: quedan tapados por los anteojos salvo cuando se le bajan -->
            <g class="ojos">
              <ellipse cx="50" cy="45" rx="3.2" ry="3.6" fill="#1d2326" />
              <ellipse cx="74" cy="45" rx="3.2" ry="3.6" fill="#1d2326" />
              <path d="M45 42 H55 M69 42 H79" stroke="#1d2326" stroke-width="2.2" stroke-linecap="round" />
            </g>

            <!-- Anteojos de sol -->
            <g class="anteojos">
              <path d="M41 43 H59 C59 51 56 55 50 55 C44 55 41 51 41 43 Z" fill="#1d2326" />
              <path d="M65 43 H83 C83 51 80 55 74 55 C68 55 65 51 65 43 Z" fill="#1d2326" />
              <path d="M59 45 H65" stroke="#1d2326" stroke-width="2.4" />
              <path d="M44 46 L49 46" stroke="#5d6a70" stroke-width="1.6" stroke-linecap="round" />
              <path d="M68 46 L73 46" stroke="#5d6a70" stroke-width="1.6" stroke-linecap="round" />
            </g>

            <!-- Nariz, boca y bigotes -->
            <path d="M60 58 L57.5 60.5 H62.5 Z" fill="#1d2326" />
            <path d="M56 63 C57.5 65.5 59.5 65.5 60 62.5 C60.5 65.5 62.5 65.5 64 63" fill="none" stroke="#1d2326" stroke-width="1.8" stroke-linecap="round" />
            <path d="M42 58 L22 54 M42 62 L22 64 M78 58 L98 54 M78 62 L98 64" stroke="#1d2326" stroke-width="1.6" stroke-linecap="round" />

            <!-- Patineta -->
            <g class="patineta">
              <rect x="8" y="106" width="104" height="9" rx="4.5" fill="#ea6435" stroke="#1d2326" stroke-width="2.4" />
              <g class="rueda rueda-izq">
                <circle cx="30" cy="122" r="6" fill="#b8c0c4" stroke="#1d2326" stroke-width="2.2" />
                <path d="M30 118.5 V125.5" stroke="#1d2326" stroke-width="1.6" stroke-linecap="round" />
              </g>
              <g class="rueda rueda-der">
                <circle cx="90" cy="122" r="6" fill="#b8c0c4" stroke="#1d2326" stroke-width="2.2" />
                <path d="M90 118.5 V125.5" stroke="#1d2326" stroke-width="1.6" stroke-linecap="round" />
              </g>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <div class="login-card">
      <div class="login-header">
        <h1>Iniciar sesión</h1>
        <p>Ingresá con tu email y tu contraseña</p>
      </div>

      <form (ngSubmit)="iniciarSesion()">
        <div class="campo">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" placeholder="usuario@email.com" autocomplete="email"
                 [ngModel]="email()" (ngModelChange)="email.set($event)" required
                 [attr.aria-invalid]="!!mensaje()" [attr.aria-describedby]="mensaje() ? 'login-error' : null" />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" autocomplete="current-password"
                 [ngModel]="password()" (ngModelChange)="password.set($event)" required
                 [attr.aria-invalid]="!!mensaje()" [attr.aria-describedby]="mensaje() ? 'login-error' : null" />
        </div>

        <button type="submit" class="boton boton-accent boton-submit" [disabled]="cargando()">
          {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>

      <p class="error-banner" id="login-error" role="alert" [hidden]="!mensaje()">{{ mensaje() }}</p>

      <p class="pie-login">¿Todavía no tenés cuenta? <a routerLink="/registro">Registrate</a></p>
    </div>
  </div>
</section>
