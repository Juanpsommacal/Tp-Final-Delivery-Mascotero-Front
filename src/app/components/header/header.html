<header class="header">

    <h1>Delivery Mascotero</h1>

    @if (auth.logueado()) {
        <li>
            <button (click)="auth.logout()">Cerrar Sesion</button>
        </li>
    } @else {
        <li>
            <a routerLink="/login" routerLinkActive="activo">Iniciar sesión</a>
        </li>
        <li>
            <a routerLink="/registro" routerLinkActive="activo">Crear cuenta</a>
        </li>
    }

    <ul class="menu">

        <li>
            <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
        </li>
    
        <li>
            <a routerLink="/productos" routerLinkActive="activo">Productos</a>
        </li>
    
        <li>
            <a routerLink="/clientes" routerLinkActive="activo">Clientes</a>
        </li>

        <li>
            <a routerLink="/proveedores" routerLinkActive="activo">Proveedores</a>
        </li>
    
        <li>
            <a routerLink="/pedidos" routerLinkActive="activo">Pedidos</a>
        </li>
    
    </ul>

</header>
