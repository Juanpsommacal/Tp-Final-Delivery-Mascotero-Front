<header class="header">
    <div class="marca">
        <a [routerLink]="auth.logueado() ? '/' : '/login'" class="logo-link">
            <img src="/DeliveryMascoteroLogo.jpg" alt="Delivery Mascotero Logo" class="logo-img" />
            <div class="logo-textos">
                <span class="logo-titulo">Delivery Mascotero</span>
                <span class="logo-subtitulo">Pet Shop & Envíos</span>
            </div>
        </a>
    </div>

    @if (auth.logueado()) {
        <nav class="nav-container">
            <ul class="menu">
                <li>
                    <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
                </li>
                <li>
                    <a routerLink="/productos" routerLinkActive="activo">Productos</a>
                </li>
                <li>
                    <a routerLink="/ofertas" routerLinkActive="activo">Ofertas</a>
                </li>
                <li>
                    <a routerLink="/clientes" routerLinkActive="activo">Clientes</a>
                </li>
                <li>
                    <a routerLink="/proveedores" routerLinkActive="activo">Proveedores</a>
                </li>
                <li>
                    <a routerLink="/pedidos" routerLinkActive="activo">Pedidos</a>
                </li>
                <li>
                    <a routerLink="/pagos" routerLinkActive="activo">Pagos</a>
                </li>
                <li>
                    <a routerLink="/compras" routerLinkActive="activo">Compras</a>
                </li>

                @if (auth.tieneRol('ADMIN')) {
                    <li>
                        <a routerLink="/reportes" routerLinkActive="activo">Métricas</a>
                    </li>
                }

            </ul>

            <div class="auth-acciones">
                <button class="boton-logout" (click)="auth.logout()">Cerrar Sesión</button>
            </div>
        </nav>
    }
</header>
